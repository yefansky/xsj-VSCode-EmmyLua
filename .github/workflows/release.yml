name: Publish VS Code Extension

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Clean yarn.lock
        run: rm -f yarn.lock

      - name: Install Dependencies
        run: yarn install --force

      - name: Install standard-version
        run: yarn add --dev standard-version

      - name: Install vsce
        run: yarn global add @vscode/vsce

      - name: Set Git user name and email
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Run standard-version
        run: npx standard-version

      - name: Push changes and tags
        run: git push --follow-tags

      - name: Run prepare scripts
        run: |
          node ./build/prepare-version.js
          node ./build/prepare.js

      - name: Package Extension
        run: vsce package

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Generate commit changelog
        id: changelog
        run: |
          # 获取当前版本
          VERSION=$(node -p "require('./package.json').version")
          
          # 获取上一个发布的tag（最后一个v开头的tag，除了当前版本）
          PREV_TAG=$(git tag -l "v*" --sort=-version:refname | grep -v "v${VERSION}" | head -n 1)
          
          if [ -z "$PREV_TAG" ]; then
            # 如果没有前一个tag，获取所有commit
            COMMIT_LOG=$(git log --oneline --pretty=format:"- %s (%h)" | head -20)
          else
            # 获取两个tag之间的commit
            COMMIT_LOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)")
          fi
          
          # 如果没有获取到commit，尝试另一种方法
          if [ -z "$COMMIT_LOG" ]; then
            COMMIT_LOG=$(git log --oneline --pretty=format:"- %s (%h)" HEAD~10..HEAD)
          fi
          
          # 创建完整的changelog
          CHANGELOG="## Version ${VERSION}
          
$(git log --pretty=format:"- %s ([%h](https://github.com/yefansky/xsj-VSCode-EmmyLua/commit/%H))" -$(git rev-list --all | wc -l)..HEAD 2>/dev/null || git log --pretty=format:"- %s ([%h](https://github.com/yefansky/xsj-VSCode-EmmyLua/commit/%H))" -20)

---
**Full Changelog**: https://github.com/yefansky/xsj-VSCode-EmmyLua/compare/v0.5.30...v${VERSION}"
          
          # 写入临时文件
          echo "$CHANGELOG" > /tmp/release_notes.md
          
          # 设置输出
          {
            echo 'changelog<<EOF'
            cat /tmp/release_notes.md
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: |
            *.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Marketplace
        uses: HaaLeo/publish-vscode-extension@v1.6.2
        with:
          pat: ${{ secrets.SHELLING }}
          registryUrl: https://marketplace.visualstudio.com
          skipDuplicate: true
