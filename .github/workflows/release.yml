name: Publish VS Code Extension

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Clean yarn.lock
        run: rm -f yarn.lock

      - name: Install Dependencies
        run: yarn install --force

      - name: Install standard-version
        run: yarn add --dev standard-version

      - name: Install vsce
        run: yarn global add @vscode/vsce

      - name: Set Git user name and email
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Run standard-version
        run: npx standard-version

      - name: Push changes and tags
        run: git push --follow-tags

      - name: Run prepare scripts
        run: |
          node ./build/prepare-version.js
          node ./build/prepare.js

      - name: Package Extension
        run: vsce package

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Get Changelog
        id: changelog
        run: |
          # 从 CHANGELOG.md 中提取最新版本的更改记录
          # 如果使用了 standard-version，CHANGELOG.md 已经自动更新
          CHANGELOG=$(cat CHANGELOG.md)
          {
            echo 'changelog<<EOF'
            echo "$CHANGELOG"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body_path: CHANGELOG.md
          files: |
            *.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Marketplace
        uses: HaaLeo/publish-vscode-extension@v1.6.2
        with:
          pat: ${{ secrets.SHELLING }}
          registryUrl: https://marketplace.visualstudio.com
          skipDuplicate: true
