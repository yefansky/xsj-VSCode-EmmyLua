name: Publish VS Code Extension

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Clean yarn.lock
        run: rm -f yarn.lock

      - name: Install Dependencies
        run: yarn install --force

      - name: Install standard-version
        run: yarn add --dev standard-version

      - name: Install vsce
        run: yarn global add @vscode/vsce

      - name: Set Git user name and email
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Run standard-version
        run: npx standard-version

      - name: Push changes and tags
        run: git push --follow-tags

      - name: Run prepare scripts
        run: |
          node ./build/prepare-version.js
          node ./build/prepare.js

      - name: Package Extension
        run: vsce package

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Extract current version changelog
        id: changelog
        run: |
          # 提取当前版本的 changelog 内容
          VERSION=$(node -p "require('./package.json').version")
          
          # 从 CHANGELOG.md 中提取当前版本的更改内容
          # 使用 awk 提取两个版本标题之间的内容
          CHANGELOG=$(awk "/^### ${VERSION}/,/^### [0-9]+\.[0-9]+\.[0-9]+/" CHANGELOG.md | head -n -1)
          
          # 如果没有找到，使用备用方法
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG=$(awk "/^### ${VERSION}/,/^###|^##/" CHANGELOG.md | grep -v "^### " | grep -v "^### " | tail -n +2 | head -n -1)
          fi
          
          # 写入临时文件
          echo "$CHANGELOG" > /tmp/release_notes.md
          cat /tmp/release_notes.md
          
          # 设置输出
          {
            echo 'changelog<<EOF'
            cat /tmp/release_notes.md
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: |
            *.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Marketplace
        uses: HaaLeo/publish-vscode-extension@v1.6.2
        with:
          pat: ${{ secrets.SHELLING }}
          registryUrl: https://marketplace.visualstudio.com
          skipDuplicate: true
